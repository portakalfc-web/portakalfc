<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portakal FC - Kadro</title>
    <style>
        body { background-color: #0b0d10; color: #fff; padding: 40px 5%; font-family: sans-serif; }
        h1 { text-align: center; margin-bottom: 40px; color: #e06b00; }
        .kadro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .oyuncu-kart { background: #12161c; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #e06b00; transition: 0.3s; }
        .oyuncu-kart:hover { transform: translateY(-10px); background: #1a1f26; }
        .forma { font-size: 50px; font-weight: 800; color: #e06b00; }
        .isim { font-size: 20px; font-weight: bold; margin-top: 10px; }
        .mevki { color: #a0aab5; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>TAKIM KADROSU</h1>
    <div class="kadro-grid">
        <div class="oyuncu-kart">
            <div class="forma">77</div>
            <div class="isim">ALİ BERAAT KARADENİZ</div>
            <div class="mevki">DEFANS / KAPTAN</div>
        </div>
    </div>
</body>
</html>
