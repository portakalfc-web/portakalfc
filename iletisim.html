<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portakal FC - İletişim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0d10;
            color: #ffffff;
        }

        header {
            background-color: #12161c;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #e06b00;
        }

        /* Logonun tıklanabilir link yapısı */
        .logo-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
        }

        .logo-alani {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .kulup-logo-cerceve {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #e06b00;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #ffffff;
            font-size: 30px;
            font-weight: bold;
        }

        .kulup-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .kulup-adi {
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
        }

        .kulup-adi span {
            color: #e06b00;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        nav ul li a {
            color: #a0aab5;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            transition: 0.3s;
        }

        nav ul li a:hover, nav ul li a.aktif {
            color: #e06b00;
        }

        .sosyal-link {
            background-color: #e06b00;
            color: #ffffff !important;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px !important;
        }

        .sosyal-link:hover {
            background-color: #ff840b;
        }

        .iletisim-konteyner {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        .sayfa-baslik {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 36px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .sayfa-baslik span {
            color: #e06b00;
        }

        .iletisim-bilgi, .iletisim-form-kart {
            background-color: #12161c;
            border-radius: 12px;
            border: 1px solid #1f2530;
            padding: 40px 30px;
        }

        .bilgi-blok {
            margin-bottom: 30px;
        }

        .bilgi-blok h3 {
            color: #e06b00;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .bilgi-blok p, .bilgi-blok a {
            font-size: 18px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        .bilgi-blok a:hover {
            color: #e06b00;
        }

        .form-grup {
            margin-bottom: 20px;
        }

        .form-grup label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #a0aab5;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-grup input, .form-grup textarea {
            width: 100%;
            background-color: #0b0d10;
            border: 1px solid #1f2530;
            padding: 12px 15px;
            color: #ffffff;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .btn-gonder {
            width: 100%;
            background-color: #e06b00;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* MOBİL RESPONSIVE KODLARI */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 2%;
                text-align: center;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }

            nav ul li a {
                font-size: 13px;
                padding: 5px;
            }

            .sayfa-baslik {
                font-size: 28px;
            }

            .iletisim-konteyner {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .iletisim-bilgi, .iletisim-form-kart {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- Logoya ve kulüp ismine tıklayınca ana sayfaya yönlendiren bağlantı -->
        <a href="index.html" class="logo-link">
            <div class="logo-alani">
                <div class="kulup-logo-cerceve">
                    <img src="logo.jpg" alt="P" class="kulup-logo" onerror="this.onerror=null; this.src='logo.jpeg';">
                </div>
                <div class="kulup-adi">Portakal <span>FC</span></div>
            </div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Anasayfa</a></li>
                <li><a href="kadro.html">Kadro</a></li>
                <li><a href="kulup.html">Kulüp</a></li>
                <li><a href="iletisim.html" class="aktif">İletişim</a></li>
                <li><a href="https://instagram.com/portakal.fc0" target="_blank" class="sosyal-link">Instagram</a></li>
            </ul>
        </nav>
    </header>

    <main class="iletisim-konteyner">
        <h1 class="sayfa-baslik">BİZİMLE <span>İLETİŞİME GEÇİN</span></h1>
        <div class="iletisim-bilgi">
            <div class="bilgi-blok">
                <h3>E-Posta Adresimiz</h3>
                <a href="mailto:portakalfc1@gmail.com">portakalfc1@gmail.com</a>
            </div>
            <div class="bilgi-blok">
                <h3>Resmi Instagram</h3>
                <a href="https://instagram.com/portakal.fc0" target="_blank">@portakal.fc0</a>
            </div>
            <div class="bilgi-blok">
                <h3>Kulüp Lokasyonu</h3>
                <p>Antalya, Türkiye</p>
            </div>
        </div>
        <div class="iletisim-form-kart">
            <form action="#" onsubmit="alert('Mesajınız başarıyla alındı reis!'); return false;">
                <div class="form-grup">
                    <label>Adınız Soyadınız</label>
                    <input type="text" placeholder="Örn: Berkay Kocakaya" required>
                </div>
                <div class="form-grup">
                    <label>E-Posta Adresiniz</label>
                    <input type="email" placeholder="E-posta adresinizi girin" required>
                </div>
                <div class="form-grup">
                    <label>Mesajınız</label>
                    <textarea rows="4" placeholder="Takımımıza mesaj yaz..." required></textarea>
                </div>
                <button type="submit" class="btn-gonder">Mesajı Gönder</button>
            </form>
        </div>
    </main>

</body>
</html>
